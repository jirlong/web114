<!doctype html>
<html lang="en">

<head>
    <title>Sticky Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 暫時移除 Bootstrap 測試是否衝突 -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"> -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
        }
        /* 完全與 simple-test.html 一致，不設置任何 overflow */
        #scene04.horizontal {
            height: 200vh;
            background-color: #f0f0f0;
        }
        .banner {
            background-color: black;
            height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .footer {
            background-color: black;
            min-height: 200vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .test-content {
            padding: 2rem;
            text-align: center;
            color: #333;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.2.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

</head>

<body>
    <!-- 前面的 Banner -->
    <div class="banner">
        <div>
            <h1>Banner (100vh)</h1>
            <p>向下滾動測試 sticky</p>
        </div>
    </div>
    
    <!-- #scene04 測試區域 -->
    <div id="scene04" class="horizontal" style="height:200vh;">
        <div style="height:100vh;position:sticky;top:0;background-color:rgba(255,0,0,0.3);border:5px solid blue;display:flex;align-items:center;justify-content:center;">
            <div class="test-content">
                <h2>Sticky Top Element</h2>
                <p>這個元素應該會粘在頂部</p>
                <p>當你滾動時，它應該保持在視窗頂部</p>
                <p>直到 #scene04 完全滾動出視口</p>
            </div>
        </div>
    </div>
    
    <!-- 後面的 Footer -->
    <div class="footer">
        <div>
            <h1>Footer (200vh)</h1>
            <p>繼續滾動</p>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // 調試信息
            var $stickyEl = $('#scene04 > div[style*="sticky"]');
            var $scene04 = $('#scene04');
            
            if ($stickyEl.length > 0) {
                var computedStyle = window.getComputedStyle($stickyEl[0]);
                var parentStyle = window.getComputedStyle($scene04[0]);
                
                console.log('=== Sticky Test Debug ===');
                console.log('Element Position:', computedStyle.position);
                console.log('Element Top:', computedStyle.top);
                console.log('Element Height:', $stickyEl.height());
                console.log('Parent Overflow:', parentStyle.overflow);
                console.log('Parent Overflow-X:', parentStyle.overflowX);
                console.log('Parent Overflow-Y:', parentStyle.overflowY);
                console.log('Parent Height:', $scene04.height());
                console.log('Parent Position:', parentStyle.position);
                console.log('Window Height:', $(window).height());
                console.log('========================');
            }
        });
    </script>
</body>

</html>
