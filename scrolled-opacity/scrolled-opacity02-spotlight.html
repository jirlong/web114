<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrolled Opacity & Spotlight Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow-x: hidden;
            /* Prevent horizontal scroll from transforms */
        }

        /* First Section: Opacity Scroll */
        #opacity-section {
            height: 300vh;
            position: relative;
        }

        .sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .earth-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            object-fit: cover;
            opacity: 1;
            /* Default opacity */
            transition: opacity 0.1s linear;
            will-change: opacity;
        }

        /* Spacer/Buffer */
        .buffer {
            height: 100vh;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
        }

        /* Second Section: Spotlight Map */


        #bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            transition: transform 1s ease-in-out;
            /* Smooth transition for spotlight effect */
            will-change: transform;
        }

        .maploc {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            /* height is defined inline or via classes */
        }

        /* Ensure the sticky column works */
        .sticky-col {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- Section 1: Opacity Scroll -->
    <div id="opacity-section">
        <div class="sticky-wrapper">
            <!-- 
                Original logic: 
                seq 1 (z-index -1)
                seq 2 (z-index -2)
                ...
                This implies the first one is on top? No, z-index -1 is higher than -2.
                So seq 1 is on top.
            -->
            <img src="https://p4css.github.io/webScroll/images/Linpen2006.jpg" class="opa earth-img" data-seq="1"
                style="z-index: 5;" alt="Linpen 2006">
            <img src="https://p4css.github.io/webScroll/images/Linpen2010.jpg" class="opa earth-img" data-seq="2"
                style="z-index: 4;" alt="Linpen 2010">
            <img src="https://p4css.github.io/webScroll/images/Linpen2012.jpg" class="opa earth-img" data-seq="3"
                style="z-index: 3;" alt="Linpen 2012">
            <img src="https://p4css.github.io/webScroll/images/Linpen2015.jpg" class="opa earth-img" data-seq="4"
                style="z-index: 2;" alt="Linpen 2015">
            <img src="https://p4css.github.io/webScroll/images/Linpen2019.jpg" class="opa earth-img" data-seq="5"
                style="z-index: 1;" alt="Linpen 2019">
        </div>
    </div>

    <!-- Buffer -->
    <div class="buffer">
        Transition to Spotlight
    </div>

    <!-- Section 2: Spotlight Map -->
    <div class="row g-0" id="map-section">
        <!-- Left column for Map Image -->
        <div class="col-6 sticky-col">
            <img id="bg-img" src="https://p4css.github.io/webScroll/images/Linpen2019_lg.jpg" alt="Map">
        </div>

        <!-- Right column for Text -->
        <div id="mapmove" class="col-6" style="background-color:#ccc;">
            <!-- 
                Total height needs to be enough to scroll.
                The user had 400vh for the container, and children with 100vh, 100vh, 200vh.
                That sums to 400vh.
            -->
            <div data-y="-50%" data-x="-10%" data-scale="2" class="maploc" style="height:100vh;background-color:#AAA">
                <h1>Section 1</h1>
            </div>
            <div data-y="-30%" data-x="-50%" data-scale="8" class="maploc" style="height:100vh;background-color:#BBB">
                <h1>Section 2</h1>
            </div>
            <div data-y="-60%" data-x="-20%" data-scale="5" class="maploc" style="height:200vh;background-color:#CCC">
                <h1>Section 3</h1>
            </div>
        </div>
    </div>

    <div class="buffer" style="background-color:gray">
        End
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const winH = window.innerHeight;

            // --- Part 1: Opacity Scroll ---
            const opacitySection = document.getElementById('opacity-section');
            const opaImages = document.querySelectorAll('.opa');
            const opaCount = opaImages.length;

            function handleOpacityScroll() {
                const rect = opacitySection.getBoundingClientRect();
                const sectionTop = rect.top;

                // Calculate scroll progress within the section
                // We want a value that represents how far we are into the section.
                // When sectionTop is 0, progress is 0.
                // When sectionTop is -height, progress is max.

                // The user's original logic:
                // opRange = parent height / 5
                // opacity = (seq * opRange - scrolled) / opRange

                // Let's adapt to relative coordinates.
                // scrolled amount relative to section start = -sectionTop
                const scrolledRelative = -sectionTop;

                if (scrolledRelative > -winH && scrolledRelative < rect.height + winH) {
                    // Calculate range per image. 
                    // We have 300vh total. 5 images.
                    // Maybe we want each image to fade out over a portion of the scroll.
                    // Let's say we want to fade out the first 4 images over the 300vh.
                    // The last image should stay visible until the end? Or fade out too?
                    // The user's logic seemed to fade them all.

                    // Let's stick to the previous file's logic which was robust:
                    // opacity = pos - progress
                    // Here we have 5 images.
                    // progress = scrolledRelative / (rect.height / (opaCount - 1)) ?

                    // Let's try mapping the scroll distance to image indices.
                    // We have 300vh. Let's say every 60vh (300/5) we transition one image?
                    // Or maybe simpler:
                    // opacity = 1 - (scrolledRelative - (index * offset)) / fadeRange

                    const sectionHeight = rect.height;
                    // Use the user's logic adaptation:
                    // opRange = sectionHeight / 5;
                    const opRange = sectionHeight / 5;

                    opaImages.forEach((img) => {
                        const seq = parseFloat(img.dataset.seq);
                        // User logic: (seq * opRange - scrolled) / opRange
                        // = seq - (scrolled / opRange)

                        // Note: scrolled in user logic was document.scrollTop.
                        // Here scrolledRelative is roughly equivalent to (scrollTop - sectionOffsetTop) if section was at top.
                        // But we need to account for when the section actually starts.
                        // If the section starts at 0, scrolledRelative is scrollTop.
                        // If section starts at 100vh, scrolledRelative is scrollTop - 100vh.

                        // The user's logic:
                        // opacity = (seq * opRange - scrolled) / opRange
                        // This implies that as scrolled increases, opacity decreases.
                        // For seq=1: opacity = 1 - scrolled/opRange. Becomes 0 when scrolled = opRange.
                        // For seq=2: opacity = 2 - scrolled/opRange. Becomes 1 when scrolled = opRange, 0 when scrolled = 2*opRange.

                        // But wait, if opacity is 2, it's clamped to 1.
                        // So seq 2 stays at 1 until scrolled > opRange.

                        // However, we need to use 'scrolledRelative' because the section might not be at the very top of the page (though here it is).
                        // But let's assume we want the effect to start when the section starts scrolling.

                        const val = (seq * opRange - scrolledRelative) / opRange;
                        img.style.opacity = Math.max(0, Math.min(1, val));
                    });
                }
            }

            // --- Part 2: Spotlight Map ---
            const mapMove = document.getElementById('mapmove');
            const mapLocs = document.querySelectorAll('.maploc');
            const bgImg = document.getElementById('bg-img');

            function handleMapScroll() {
                const mapRect = mapMove.getBoundingClientRect();

                // Check if we are inside the map section
                // The user logic: if scrolled < mapmove.offset or > mapmove.end, reset.
                // We can check if mapRect.top < winH && mapRect.bottom > 0

                if (mapRect.top < winH && mapRect.bottom > 0) {
                    // Find which maploc is currently most active/visible
                    // We can check the center of the viewport
                    const viewCenter = winH / 2;

                    let activeLoc = null;

                    // Iterate to find the one that covers the center or is closest
                    mapLocs.forEach(loc => {
                        const locRect = loc.getBoundingClientRect();
                        // Check if this loc covers the center of the viewport
                        if (locRect.top <= viewCenter && locRect.bottom >= viewCenter) {
                            activeLoc = loc;
                        }
                    });

                    if (activeLoc) {
                        const x = activeLoc.dataset.x;
                        const y = activeLoc.dataset.y;
                        const scale = activeLoc.dataset.scale;

                        bgImg.style.transform = `translate(${x}, ${y}) scale(${scale})`;
                    }
                } else {
                    // Reset if out of view (optional, but good for clean state)
                    // The user logic had an explicit reset.
                    bgImg.style.transform = 'translate(0%, 0%) scale(1)';
                }
            }

            // Main Scroll Handler
            function onScroll() {
                handleOpacityScroll();
                handleMapScroll();
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll(); // Initial call
        });
    </script>
</body>

</html>
