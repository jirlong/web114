    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球 - 國家導覽</title>

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
        }

        #globeViz {
            width: 100vw;
            height: 100vh;
        }

        #info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            pointer-events: none;
            display: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            max-width: 300px;
        }

        #country-name {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 5px;
        }

        #country-name-en {
            font-size: 14px;
            color: #aaa;
        }

        .instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            pointer-events: none;
            text-align: center;
        }
    </style>
    <script src="https://unpkg.com/globe.gl"></script>
</head>

        let selectedCountry = null;

        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .lineHoverPrecision(0)
            .polygonsData([])
            .polygonAltitude(0.06)
            .polygonCapColor(d => d === selectedCountry ? 'rgba(0, 255, 255, 0.3)' : 'rgba(0, 0, 0, 0)')
            .polygonSideColor(() => 'rgba(0, 100, 100, 0.15)')
            .polygonStrokeColor(() => '#111')
            .polygonLabel(({ properties: d }) => `
        <div style="background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; color: white;">
          <b>${countryTranslations[d.ADMIN] || d.ADMIN}</b> <span style="font-size: 0.8em; color: #ccc">(${d.ADMIN})</span>
        </div>
      `)
            .onPolygonClick(d => {
                selectedCountry = d;
                world.polygonCapColor(world.polygonCapColor()); // Trigger update

                // Update Info Box
                const nameEn = d.properties.ADMIN;
                const nameZh = countryTranslations[nameEn] || nameEn;

                const infoBox = document.getElementById('info-box');
                const nameEl = document.getElementById('country-name');
                const nameEnEl = document.getElementById('country-name-en');

                nameEl.textContent = nameZh;
                nameEnEl.textContent = nameEn;
                infoBox.style.display = 'block';

                // Auto-rotate to the selected country
                const bbox = d.bbox; // Some geojson sources have bbox, but let's calculate centroid if needed or use globe.gl utility

                // But d is the feature. Let's get the centroid or just use the click point?
                // Actually, globe.gl's onPolygonClick passes the feature 'd', and the event 'event', and coords.
                // Let's just focus on highlighting for now as requested.
            });

            // We need GeoJSON features, world-atlas is TopoJSON usually? 
            // Let's use the standard ne_110m_admin_0_countries.geojson which is safer for direct use
        });

            .then(res => res.json())
            .then(countries => {
                world.polygonsData(countries.features);
            });

        world.controls().autoRotateSpeed = 0.5;

            world.controls().autoRotate = false;
