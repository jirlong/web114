<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台灣縣市人口 — D3 Horizontal Bar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      padding: 20px;
    }

    .label {
      width: 140px;
      font-weight: 600;
    }

    .small-note {
      color: #666;
      font-size: 0.95rem;
    }

    /* chart styles */
    .chart-wrap {
      width: 100%;
    }

    svg {
      width: 100%;
      display: block;
    }

    .bar-rect {
      fill: url(#barGradient);
      rx: 6;
      ry: 6;
    }

    .bar-text {
      fill: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .name-text {
      fill: #222;
      font-weight: 600;
      font-size: 0.95rem;
      text-anchor: end;
    }

    @media (max-width: 767px) {
      .label {
        width: 110px;
      }
    }
  </style>
</head>

<body>

  <!-- opening banner -->
  <div class="vh-100 bg-primary d-flex align-items-center justify-content-center text-white">
    <div class="text-center">
      <h1 class="display-4">台灣人口分佈（D3）</h1>
      <p class="lead">SVG horizontal bar chart with Intersection-triggered animation</p>
    </div>
  </div>

  <div class="container my-4">
    <h1 class="mb-3">台灣縣市人口（示意）</h1>
    <p class="small-note">左側使用 D3 繪製水平長條圖，右側為對應資料表（由多到少）。進入畫面中央 50vh 時會觸發動畫。</p>

    <div class="row">
      <div class="col-md-6">
        <h4>人口長條圖（D3）</h4>
        <div id="chart-wrapper" class="chart-wrap" aria-hidden="false"></div>
      </div>

      <div class="col-md-6">
        <h4>資料表（由多到少）</h4>
        <div class="table-responsive">
          <table class="table table-sm table-striped" id="pop-table-d3">
            <thead>
              <tr>
                <th>縣市</th>
                <th class="text-end">人口數</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- footer -->
  <div class="vh-100 bg-dark d-flex align-items-center justify-content-center text-white">
    <div class="text-center">
      <p class="mb-0">示意人口數，僅供展示用途</p>
    </div>
  </div>

  <script>
    // Generated population data (same set as data02.html)
    const data = [
      { name: '新北市', pop: 4010000 },
      { name: '台中市', pop: 2820000 },
      { name: '高雄市', pop: 2760000 },
      { name: '台北市', pop: 2640000 },
      { name: '桃園市', pop: 2230000 },
      { name: '台南市', pop: 1870000 },
      { name: '彰化縣', pop: 1260000 },
      { name: '屏東縣', pop: 780000 },
      { name: '雲林縣', pop: 690000 },
      { name: '新竹縣', pop: 580000 },
      { name: '苗栗縣', pop: 560000 },
      { name: '嘉義縣', pop: 510000 },
      { name: '南投縣', pop: 490000 },
      { name: '新竹市', pop: 450000 },
      { name: '宜蘭縣', pop: 460000 },
      { name: '基隆市', pop: 350000 },
      { name: '花蓮縣', pop: 320000 },
      { name: '嘉義市', pop: 270000 },
      { name: '台東縣', pop: 220000 },
      { name: '金門縣', pop: 140000 },
      { name: '澎湖縣', pop: 100000 },
      { name: '連江縣', pop: 13000 }
    ];

    // sort descending
    const sorted = data.slice().sort((a, b) => b.pop - a.pop);

    // populate right table
    const tbody = document.querySelector('#pop-table-d3 tbody');
    sorted.forEach(d => {
      const tr = document.createElement('tr');
      const td1 = document.createElement('td'); td1.textContent = d.name;
      const td2 = document.createElement('td'); td2.className = 'text-end'; td2.textContent = d.pop.toLocaleString();
      tr.appendChild(td1); tr.appendChild(td2); tbody.appendChild(tr);
    });

    // D3 chart setup
    (function () {
      const wrapper = d3.select('#chart-wrapper');

      const margin = { top: 12, right: 16, bottom: 12, left: 140 };
      const barHeight = 36;

      function render() {
        wrapper.selectAll('*').remove();

        const width = wrapper.node().clientWidth;
        const height = sorted.length * (barHeight + 8) + margin.top + margin.bottom;

        const svg = wrapper.append('svg')
          .attr('width', width)
          .attr('height', height)
          .attr('viewBox', `0 0 ${width} ${height}`);

        // defs gradient
        const defs = svg.append('defs');
        const grad = defs.append('linearGradient').attr('id', 'barGradient').attr('x1', '0%').attr('x2', '100%');
        grad.append('stop').attr('offset', '0%').attr('stop-color', '#4e79a7');
        grad.append('stop').attr('offset', '100%').attr('stop-color', '#59a14f');

        const innerWidth = Math.max(10, width - margin.left - margin.right);
        const x = d3.scaleLinear().domain([0, d3.max(sorted, d => d.pop)]).range([0, innerWidth]);
        const y = d3.scaleBand().domain(sorted.map(d => d.name)).range([margin.top, height - margin.bottom]).padding(0.2);

        // groups for bars
        const g = svg.append('g');

        // name labels (left)
        g.selectAll('.name')
          .data(sorted)
          .enter()
          .append('text')
          .attr('class', 'name-text')
          .attr('x', margin.left - 8)
          .attr('y', d => y(d.name) + y.bandwidth() / 2 + 4)
          .text(d => d.name);

        // bar groups
        const bars = g.selectAll('.bar-group')
          .data(sorted)
          .enter()
          .append('g')
          .attr('class', 'bar-group')
          .attr('transform', d => `translate(${margin.left},${y(d.name)})`);

        // rects (initial width 0)
        bars.append('rect')
          .attr('class', 'bar-rect')
          .attr('x', 0)
          .attr('y', 0)
          .attr('height', y.bandwidth())
          .attr('width', 0);

        // population text inside bar (initially positioned at 4px from left, but will be moved to end on transition)
        bars.append('text')
          .attr('class', 'bar-text')
          .attr('x', 8)
          .attr('y', y.bandwidth() / 2 + 4)
          .text(d => d.pop.toLocaleString());

        // store selection for later animation trigger
        // put the svg node on wrapper for observer to query
        wrapper.node().__svg = svg;
        wrapper.node().__x = x;
        wrapper.node().__innerWidth = innerWidth;
      }

      // initial render
      render();

      // animate when chart enters central 50vh
      const observerOptions = { root: null, threshold: 0.1 };
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            // animate bars with D3 transitions and stagger
            const svg = wrapper.node().__svg;
            const x = wrapper.node().__x;
            const innerWidth = wrapper.node().__innerWidth;

            const rects = svg.selectAll('.bar-rect').nodes();
            const texts = svg.selectAll('.bar-text').nodes();

            rects.forEach((rectNode, i) => {
              const d = sorted[i];
              const targetW = x(d.pop);
              d3.select(rectNode)
                .transition()
                .delay(i * 70)
                .duration(800)
                .attr('width', targetW)
                .ease(d3.easeCubicOut);

              // move or color text after rectangle grows
              d3.select(texts[i])
                .transition()
                .delay(i * 70 + 200)
                .duration(600)
                .tween('adjust', function () {
                  const text = d3.select(this);
                  return function (t) {
                    const w = targetW * t;
                    // if the bar is wide enough, keep text inside at end; otherwise keep at left padding
                    if (w > 70) {
                      text.attr('x', Math.max(8, w - 8));
                      text.attr('text-anchor', 'end');
                    } else {
                      text.attr('x', 8).attr('text-anchor', 'start');
                    }
                  };
                });
            });

            obs.unobserve(entry.target);
          }
        });
      }, observerOptions);

      const el = document.getElementById('chart-wrapper');
      if (el) observer.observe(el);

      // handle simple resize: re-render (no heavy debouncing for brevity)
      window.addEventListener('resize', () => {
        render();
      });
    })();
  </script>

</body>

</html>
