    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球儀 - 互動式國家展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            overflow-x: hidden;
        }

        #banner {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
        }

        #earth {
            width: 100%;
            height: 500vh;
            position: relative;
            background: #000;
        }

        #globeViz {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
        }

        #footer {
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
            position: relative;
            z-index: 10;
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            min-width: 250px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        #info h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #4CAF50;
        }

        #info p {
            margin: 5px 0;
            font-size: 16px;
        }

        #info .label {
            color: #aaa;
            font-size: 14px;
        }

        #info .value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>

    <!-- Banner Section -->
    <div id="banner">
        歡迎來到 3D 地球儀
    </div>

        <div class="instructions">
            向下捲動觀看地球從紐約旋轉到台灣
        </div>
    </div>

        const globe = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .enablePointerInteraction(false)
            .polygonCapColor(d => d === selectedCountry ? '#ff6b6b' : 'rgba(100, 150, 200, 0.7)')
            .polygonSideColor(() => 'rgba(100, 150, 200, 0.15)')
            .polygonStrokeColor(() => '#111')
            .polygonsTransitionDuration(300)
            // 航線設定
            .arcsData([])
            .arcStartLat(d => d.startLat)
            .arcStartLng(d => d.startLng)
            .arcEndLat(d => d.endLat)
            .arcEndLng(d => d.endLng)
            .arcColor(() => '#FF6B35')
            .arcStroke(0.8)
            .arcDashLength(1)
            .arcDashGap(0)
            .arcDashAnimateTime(0)
            .arcAltitude(0.25)
            .arcAltitudeAutoScale(0.5)
            // 路徑點標記
            .pointsData(routePoints)
            .pointLat(d => d.lat)
            .pointLng(d => d.lng)
            .pointColor(() => '#FFD700')
            .pointAltitude(0.01)
            .pointRadius(0.3)
            .pointLabel(d => `
                <div style="background: rgba(0,0,0,0.9); padding: 8px 12px; border-radius: 6px; font-family: 'Microsoft JhengHei', sans-serif;">
                    <div style="color: #FFD700; font-size: 16px; font-weight: bold;">
                        ${d.name}
                    </div>
                </div>
            `);

        // 載入國家地理數據
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(data => {
                countries = data.features;
                globe.polygonsData(countries);
                isGlobeReady = true;

                // 設定初始位置為紐約，altitude 1.2（非常近的距離）
                globe.pointOfView({ lat: newYork.lat, lng: newYork.lng, altitude: 1.2 }, 0);
            });

        // 處理滾動事件
        function handleScroll() {
            if (!isGlobeReady) return;

            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const globeVizElement = document.getElementById('globeViz');
            const infoElement = document.getElementById('info');

            // Banner 高度
            const bannerHeight = windowHeight;

            // Earth section 的起始和結束位置
            const earthStart = bannerHeight;
            const earthHeight = windowHeight * 5; // 500vh
            const earthEnd = earthStart + earthHeight;

            // Footer 的起始位置（頁面上的實際位置）
            const footerStart = earthEnd;

            // 動畫應該在 footer 碰到螢幕底部時完成
            // 也就是當 scrollY + windowHeight = footerStart
            // 即 scrollY = footerStart - windowHeight
            const animationEnd = footerStart - windowHeight;

            // 如果還在 banner 區域，隱藏地球儀
            if (scrollY < earthStart) {
                globeVizElement.style.opacity = '0';
                infoElement.style.display = 'none';
                // 隱藏航線
                globe.arcsData([]);
                return;
            }

            // 如果進入 earth 區域或之後，顯示地球儀和資訊面板
            globeVizElement.style.opacity = '1';
            infoElement.style.display = 'block';

            // 如果已經完成動畫（footer 頂部已經碰到或超過螢幕底部），固定在台灣
            if (scrollY >= animationEnd) {
                globe.pointOfView({ lat: taiwan.lat, lng: taiwan.lng, altitude: 1.2 }, 0);

                // 顯示完整航線（所有段）
                globe.arcsData(allFlightArcs);

                // 更新資訊面板顯示台灣
                infoElement.innerHTML = `
                    <h2>目的地</h2>
                    <div style="margin-top: 15px;">
                        <p class="label">國家名稱</p>
                        <p class="value">台灣</p>
                    </div>
                    <div style="margin-top: 10px;">
                        <p class="label">首都</p>
                        <p class="value">台北</p>
                    </div>
                `;
                return;
            }

            // 在 earth 區域內，計算從紐約到台灣的旋轉進度
            if (scrollY >= earthStart && scrollY < animationEnd) {
                // 計算在 earth section 中的進度 (0 到 1)
                // 動畫區間是從 earthStart 到 animationEnd
                const animationDistance = animationEnd - earthStart;
                const progress = (scrollY - earthStart) / animationDistance;

                // 計算航線段進度
                const totalSegments = allFlightArcs.length; // 7 段
                const segmentProgress = progress * totalSegments; // 0 到 7
                const completedSegments = Math.floor(segmentProgress); // 完成的整段數
                const currentSegmentProgress = segmentProgress - completedSegments; // 當前段的進度 (0-1)

                // 根據航線路徑計算當前的經緯度
                let currentLat, currentLng;

                if (completedSegments >= routePoints.length - 1) {
                    // 已到達最後一個點
                    currentLat = taiwan.lat;
                    currentLng = taiwan.lng;
                } else {
                    // 在當前航段中插值
                    const startPoint = routePoints[completedSegments];
                    const endPoint = routePoints[completedSegments + 1];
                    currentLat = startPoint.lat + (endPoint.lat - startPoint.lat) * currentSegmentProgress;
                    currentLng = startPoint.lng + (endPoint.lng - startPoint.lng) * currentSegmentProgress;
                }

                // 計算 altitude：先 zoom-out（拉遠）再 zoom-in（拉近）
                // 使用拋物線：在中間（progress = 0.5）達到最大 altitude
                // 起點和終點：altitude = 1.2（非常近）
                // 中間：altitude = 1.2 + 3.0 = 4.2（拉遠）
                const altitudeBoost = 3.0 * (1 - 4 * Math.pow(progress - 0.5, 2));
                const currentAlt = 1.2 + altitudeBoost;

                // 更新地球儀視角（不使用動畫）
                globe.pointOfView({
                    lat: currentLat,
                    lng: currentLng,
                    altitude: currentAlt
                }, 0);

                // 更新航線：根據進度顯示相應的航線段
                const visibleArcs = [];

                // 添加所有已完成的段
                for (let i = 0; i < completedSegments && i < totalSegments; i++) {
                    visibleArcs.push(allFlightArcs[i]);
                }

                // 添加當前正在繪製的段（部分顯示）
                if (completedSegments < totalSegments && currentSegmentProgress > 0) {
                    const currentArc = allFlightArcs[completedSegments];
                    const partialEndLat = currentArc.startLat +
                        (currentArc.endLat - currentArc.startLat) * currentSegmentProgress;
                    const partialEndLng = currentArc.startLng +
                        (currentArc.endLng - currentArc.startLng) * currentSegmentProgress;

                    visibleArcs.push({
                        startLat: currentArc.startLat,
                        startLng: currentArc.startLng,
                        endLat: partialEndLat,
                        endLng: partialEndLng,
                        segmentIndex: currentArc.segmentIndex
                    });
                }

                globe.arcsData(visibleArcs);

                // 更新資訊面板顯示進度和當前經過的城市
                const percentage = Math.round(progress * 100);
                const currentPointIndex = Math.min(completedSegments, routePoints.length - 1);
                const currentCity = routePoints[currentPointIndex].name;
                const nextCity = currentPointIndex < routePoints.length - 1 ?
                    routePoints[currentPointIndex + 1].name : '台灣';

                infoElement.innerHTML = `
                    <h2>旅程進行中</h2>
                    <div style="margin-top: 15px;">
                        <p class="label">當前位置</p>
                        <p class="value">${currentCity} → ${nextCity}</p>
                    </div>
                    <div style="margin-top: 10px;">
                        <p class="label">進度</p>
                        <p class="value">${percentage}%</p>
                    </div>
                    <div style="margin-top: 10px;">
                        <p class="label">航段</p>
                        <p class="value">${completedSegments + 1} / ${totalSegments}</p>
                    </div>
                `;
            }
        }

        // 添加滾動事件監聽
        window.addEventListener('scroll', handleScroll, { passive: true });

        // 初始檢查
        handleScroll();
    </script>
</body>
</html>
